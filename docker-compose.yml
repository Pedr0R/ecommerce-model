version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./docker/postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=mongo
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  users-service:
    build: ./users
    container_name: users-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres

  catalogo-service:
    build: ./catalogo
    container_name: catalogo-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
    depends_on:
      - mongodb

  pedido-service:
    build: ./pedido
    container_name: pedido-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - SERVICES_USERS_URL=http://users-service:8085/users/
      - SERVICES_CATALOGO_URL=http://catalogo-service:8084/produtos/
    depends_on:
      - postgres
      - rabbitmq
      - users-service
      - catalogo-service

  pagamento-service:
    build: ./pagamento
    container_name: pagamento-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  notificacoes-service:
    build: ./notificacoes
    container_name: notificacoes-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq

  api-gateway-service:
    build: ./api-gateway
    container_name: api-gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - USERS_URL=http://users-service:8085
      - CATALOGO_URL=http://catalogo-service:8084
      - PEDIDO_URL=http://pedido-service:8081
    depends_on:
      - users-service
      - catalogo-service
      - pedido-service

  frontend-dashboard:
    build: ./frontend
    container_name: frontend-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway-service

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
