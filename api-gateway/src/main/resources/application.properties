server.port=8080
spring.application.name=api-gateway

# Spring Cloud Gateway Routing Configuration
spring.cloud.gateway.routes[0].id=users-service
spring.cloud.gateway.routes[0].uri=${USERS_URL:http://localhost:8085}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=catalogo-service
spring.cloud.gateway.routes[1].uri=${CATALOGO_URL:http://localhost:8084}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/produtos/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=pedido-service
spring.cloud.gateway.routes[2].uri=${PEDIDO_URL:http://localhost:8081}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pedidos/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Global CORS Configuration for Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
